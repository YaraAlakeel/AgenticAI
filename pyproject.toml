[project]
name = "tiny-coder"
version = "0.1.0"
description = "A minimal, safe coding-agent harness: fixes small Python bugs until the tests pass."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.60",
    "mcp>=1.9",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pytest>=8.0",
]

[tool.uv]
package = false
